<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Tiendas</title> 
    <link rel="stylesheet" href="stylee.css"> 
</head>

<body> 

<header>
    <h1 id="titulo-principal">Tiendas</h1>
    <button id="btn-modo" type="button">Modo Claro / Oscuro</button>
</header>

<main> 
    <section> 

        {% for item in items %}
        <article>
            <h3>{{ item.nombre }}</h3> 

            <ul> 
                <li><strong>Trabajadores:</strong> {{ item.trabajadores }}</li>
                <li><strong>Ubicación:</strong> {{ item.ubicacion }}</li>
                <li><strong>Horario:</strong> {{ item.horario }}</li>
            </ul>

            <!-- Si tienes imágenes guardadas -->
            <img src="{{ item.imagen }}" alt="{{ item.nombre }}" width="200"> 

            <p></p> 

            <!-- Si tienes enlace en la BD -->
            <a href="{{ item.enlace }}" target="_blank">Más información</a> 

            <button class="openBtn">Marcar tienda como favorita</button>

            <dialog class="miModal">
                <h2>Marcada como favorita</h2>
                <p>¡Perfecto!</p>
                <button class="closeBtn">Cerrar</button>
            </dialog>

        </article>
        {% endfor %}

    </section> 
</main> 

<footer> 
    <p>Pie de página: Creado por <em>Carolina, Victoria y Avril - 2026</em></p> 
</footer>

<script src="main.js"></script>

</body> 
</html>
